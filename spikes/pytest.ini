[pytest]
# Spike tests. Run from this folder: python -m pytest
testpaths = .
python_files = test_*.py
# No .pytest_cache in the working copy. Set PYTHONDONTWRITEBYTECODE=1 as well to avoid __pycache__.
addopts = -ra -p no:cacheprovider
norecursedirs = .* __pycache__ out data build dist venv .venv node_modules
