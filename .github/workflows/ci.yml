# Two kinds of run, from one codebase that is pure Python and standard library only, so
# nothing is built per operating system; CI only checks that the same code runs everywhere.
# Minutes are counted (Windows twice, macOS ten times), so each run does only what it must.
#
# - Pushes to main and phase-2, and pull requests (a work branch gets its run through its pull
#   request): the quick check with Python 3.12 on Linux (every test) and Windows (every test
#   but the slow, git-heavy ones marked heavy, which run on Windows in the full run); the
#   TypeScript helper's tests (helpers/typescript, Node 20), the TypeScript contract tests that
#   run the compiler pinned in orchestraty/tests/fixtures/ts, and the editor extension's tests
#   (editors/vscode, Node 22), on Linux, with its .vsix packaged and kept as a build artifact
#   (nothing is published); and the one distribution, its sdist and wheel built on Linux, with
#   the smoke test of that wheel in a clean virtual environment on Windows and Linux.
# - Weekly (main), on manual runs and on release tags (v*): the full run, which adds Python
#   3.10 and 3.11 on Linux, the whole suite on Windows, and the Node jobs on Windows; macOS (the
#   suite and the smoke test) only on manual runs and release tags. Releases are release.yml's.
# - A newer push to the same branch or pull request cancels the run it makes out of date.
#
# The quick and full jobs run both suites (the main package and the engine); every job fails
# if the tests leave any file behind. pytest is the only Python dependency.
name: CI

on:
  push:
    branches: [main, phase-2]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"          # Mondays, 06:00 UTC: the weekly full run

permissions:
  contents: read

# One run at a time per branch or pull request: a newer push cancels the older run. Never for
# release tags or the weekly run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' }}

jobs:
  quick:
    name: quick (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    # The tests marked heavy run many git commands, which take about ten times as long on the
    # Windows runner as on Linux, so the Windows quick run leaves them to the full run.
    timeout-minutes: 30
    strategy:
      # Report both platforms, even when one of them fails.
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest, so a runner image change never breaks a push.
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      # Printed so a failure shows which git ran (the fixtures depend on git's behaviour).
      - name: Show the git version
        run: git --version

      # No cache and no bytecode, so the leftover check below finds nothing. On Windows the
      # heavy team tests are left to the full run.
      - name: Run the main package tests
        working-directory: orchestraty
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pytest -m "not heavy"
          else
            python -m pytest
          fi

      - name: Run the engine tests
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider

      # The tests must leave nothing in the working copy: no __pycache__, no .pytest_cache,
      # no output files. Runs from the repository root, in bash on every OS.
      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine scripts plugins .claude-plugin)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  node:
    name: node helper (${{ matrix.os }}, Node 20)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '["windows-latest", "ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: helpers/typescript
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/typescript/package-lock.json

      # The tests run the real hook script and plant notes with the Python package.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dev dependencies from the lockfile
        run: npm ci

      - name: Build
        run: npx tsc -p tsconfig.json

      - name: Run the tests
        run: node --test dist/test/helper.test.js

      # The build output and node_modules are ignored; nothing else may be left.
      - name: Check that the tests left no files behind
        shell: bash
        working-directory: .
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine; git status --porcelain -- helpers)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  # The VS Code and Cursor extension: its unit tests and the extension against a stand-in for
  # the editor's API, on Linux (and Windows in the full run); the .vsix packaged on Linux and
  # kept for a week. The
  # packaging tool needs Node 22. Python runs the tests' checks against the orchestraty package.
  editor:
    name: editor extension (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '["windows-latest", "ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dev dependencies from the lockfile
        run: npm ci

      - name: Build and run the tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: npm test

      - name: Package the .vsix
        if: runner.os == 'Linux'
        run: npx vsce package --no-dependencies --skip-license --out orchestraty.vsix

      - name: Keep the .vsix
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: editors/vscode/orchestraty.vsix
          if-no-files-found: error
          retention-days: 7

      # The build output, the .vsix and node_modules are ignored; nothing else may be left.
      - name: Check that the tests left no files behind
        shell: bash
        working-directory: .
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine; git status --porcelain -- editors)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  # Without the compiler these tests are skipped; here ORCH_TS_REQUIRED makes that an error.
  typescript:
    name: TypeScript contracts (${{ matrix.os }}, Node 20)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '["windows-latest", "ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestraty/tests/fixtures/ts/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Install the pinned TypeScript from the lockfile
        working-directory: orchestraty/tests/fixtures/ts
        run: npm ci

      - name: Run the TypeScript contract tests
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ORCH_TS_REQUIRED: "1"
        run: python -m pytest tests/test_typescript_compiler.py tests/test_typescript.py tests/test_dts.py tests/test_tsimports.py

      # The compiler npm ci installed is ignored and expected; nothing else may be left.
      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine | grep -vxF '!! orchestraty/tests/fixtures/ts/node_modules/' || true)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  # The one distribution: the sdist and the py3-none-any wheel, built once on Linux, and a check
  # of what they hold. The smoke jobs install this wheel.
  package:
    name: package (sdist and wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the build front end and pytest
        run: python -m pip install "build>=1.2" "pytest>=8,<10"

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check what they hold
        working-directory: orchestraty
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ORCH_PACKAGE_REQUIRED: "1"
        run: ORCH_WHEEL="$(ls ../dist/*.whl)" ORCH_SDIST="$(ls ../dist/*.tar.gz)" python -m pytest tests/test_package.py

      - name: Keep them for the smoke test
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The built wheel in a clean virtual environment (scripts/smoke.py): orch --version, orch
  # init --print, two scripted sessions through the installed hook script reaching a note, and
  # orch doctor; then an ordinary day on it (scripts/real_day.py). No real agent and no network.
  # macOS joins on manual runs and release tags.
  smoke:
    name: smoke (${{ matrix.os }}, the built wheel)
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '["windows-latest", "ubuntu-24.04", "macos-latest"]' || '["windows-latest", "ubuntu-24.04"]') }}
    steps:
      - name: Check out the repository (for scripts/smoke.py)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the built files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run the smoke test on the wheel
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/smoke.py dist/*.whl

      # An ordinary day on the same wheel (scripts/real_day.py): one orch init from no project,
      # a repository with many worktrees and a folder without git, sessions shown within seconds,
      # a caller left behind in the folder, one dashboard address, and an upgrade that restarts
      # the coordinator by itself.
      - name: Run an ordinary day on the wheel
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/real_day.py dist/*.whl

      # The smoke test works in a temporary folder; dist/ is ignored.
      - name: Check that the smoke test left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine scripts plugins .claude-plugin)"
          if [ -n "$leftovers" ]; then
            echo "The smoke test left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  full:
    name: full (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    # The whole suite on Windows, heavy tests included, can take 40 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux 3.10 and 3.11, and the whole suite on Windows; macOS (whose minutes count ten
        # times) only on manual runs and release tags, not every week.
        include: ${{ fromJSON(github.event_name == 'schedule' && '[{"os":"ubuntu-24.04", "python-version":"3.10"},{"os":"ubuntu-24.04", "python-version":"3.11"},{"os":"windows-latest", "python-version":"3.12"}]' || '[{"os":"ubuntu-24.04", "python-version":"3.10"},{"os":"ubuntu-24.04", "python-version":"3.11"},{"os":"windows-latest", "python-version":"3.12"},{"os":"macos-latest", "python-version":"3.12"}]') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Show the git version
        run: git --version

      - name: Run the main package tests
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Run the engine tests
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider

      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine scripts plugins .claude-plugin)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi
