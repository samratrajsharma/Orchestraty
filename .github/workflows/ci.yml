# Runs the engine test suite on every push and pull request.
# The engine's core is standard library only, so pytest is the one dependency.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    name: engine tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Report every platform, even when one of them fails.
      fail-fast: false
      matrix:
        include:
          # Versions are quoted: unquoted, YAML reads 3.10 as the number 3.1.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      # No -q here: engine/pytest.ini already adds -q, and a second -q hides the "N passed" line.
      - name: Run the engine tests
        run: python -m pytest
