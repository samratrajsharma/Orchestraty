# Two kinds of run, from one codebase that is pure Python and standard library only, so
# nothing is built per operating system; CI only checks that the same code runs everywhere.
#
# - Every push and pull request: the quick check, on Windows and Linux with Python 3.12.
# - Weekly, on manual runs and on release tags (v*): the full matrix, which adds Python 3.9
#   to 3.11, macOS and the older-Python runs of the experiments.
#
# Every job runs all three suites (the main package, the engine and the experiments) and fails
# if the tests leave any file behind. pytest is the only dependency.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"          # Mondays, 06:00 UTC: the weekly full run

permissions:
  contents: read

jobs:
  quick:
    name: quick (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report both platforms, even when one of them fails.
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest, so a runner image change never breaks a push.
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      # Printed so a failure shows which git ran (the fixtures depend on git's behaviour).
      - name: Show the git version
        run: git --version

      # No cache and no bytecode, so the leftover check below finds nothing.
      - name: Run the main package tests
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Run the engine tests
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider

      - name: Run the experiment tests
        working-directory: spikes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      # The tests must leave nothing in the working copy: no __pycache__, no .pytest_cache,
      # no output files. Runs from the repository root, in bash on every OS.
      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine spikes)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  full:
    name: full (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 runs only the experiments: the scanner must run on older Pythons (macOS ships
          # 3.9), while the main package and the engine need 3.10 or later. No 3.9 build exists
          # for the Ubuntu 26.04 image, so the Linux runs stay on ubuntu-24.04.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # On 3.9 this range resolves to pytest 8.x; pytest 9 needs 3.10 or later.
      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Show the git version
        run: git --version

      - name: Run the main package tests
        if: matrix.python-version != '3.9'
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Run the engine tests
        if: matrix.python-version != '3.9'
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider

      - name: Run the experiment tests
        working-directory: spikes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine spikes)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi
