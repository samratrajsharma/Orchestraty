# Two kinds of run, from one codebase that is pure Python and standard library only, so
# nothing is built per operating system; CI only checks that the same code runs everywhere.
#
# - Every push and pull request: the quick check, on Windows and Linux with Python 3.12; the
#   TypeScript helper's tests (helpers/typescript) with Node 20 on both; and the TypeScript
#   contract tests that run the compiler, with the TypeScript that orchestraty/tests/fixtures/ts
#   pins, on both.
# - Weekly, on manual runs and on release tags (v*): the full matrix, which adds Python 3.9
#   to 3.11, macOS and the older-Python runs of the experiments.
#
# The quick and full jobs run all three suites (the main package, the engine and the experiments);
# every job fails if the tests leave any file behind. pytest is the only Python dependency.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"          # Mondays, 06:00 UTC: the weekly full run

permissions:
  contents: read

jobs:
  quick:
    name: quick (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report both platforms, even when one of them fails.
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest, so a runner image change never breaks a push.
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      # Printed so a failure shows which git ran (the fixtures depend on git's behaviour).
      - name: Show the git version
        run: git --version

      # No cache and no bytecode, so the leftover check below finds nothing.
      - name: Run the main package tests
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Run the engine tests
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider

      - name: Run the experiment tests
        working-directory: spikes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      # The tests must leave nothing in the working copy: no __pycache__, no .pytest_cache,
      # no output files. Runs from the repository root, in bash on every OS.
      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine spikes)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  node:
    name: node helper (${{ matrix.os }}, Node 20)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: helpers/typescript
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/typescript/package-lock.json

      # The tests run the real hook script and plant notes with the Python package.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dev dependencies from the lockfile
        run: npm ci

      - name: Build
        run: npx tsc -p tsconfig.json

      - name: Run the tests
        run: node --test dist/test/helper.test.js

      # The build output and node_modules are ignored; nothing else may be left.
      - name: Check that the tests left no files behind
        shell: bash
        working-directory: .
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine spikes; git status --porcelain -- helpers)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  # Without the compiler these tests are skipped; here ORCH_TS_REQUIRED makes that an error.
  typescript:
    name: TypeScript contracts (${{ matrix.os }}, Node 20)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestraty/tests/fixtures/ts/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Install the pinned TypeScript from the lockfile
        working-directory: orchestraty/tests/fixtures/ts
        run: npm ci

      - name: Run the TypeScript contract tests
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ORCH_TS_REQUIRED: "1"
        run: python -m pytest tests/test_typescript_compiler.py tests/test_typescript.py tests/test_dts.py tests/test_tsimports.py

      # The compiler npm ci installed is ignored and expected; nothing else may be left.
      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine spikes | grep -vxF '!! orchestraty/tests/fixtures/ts/node_modules/' || true)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  full:
    name: full (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 runs only the experiments: the scanner must run on older Pythons (macOS ships
          # 3.9), while the main package and the engine need 3.10 or later. No 3.9 build exists
          # for the Ubuntu 26.04 image, so the Linux runs stay on ubuntu-24.04.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # On 3.9 this range resolves to pytest 8.x; pytest 9 needs 3.10 or later.
      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Show the git version
        run: git --version

      - name: Run the main package tests
        if: matrix.python-version != '3.9'
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Run the engine tests
        if: matrix.python-version != '3.9'
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider

      - name: Run the experiment tests
        working-directory: spikes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine spikes)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi
