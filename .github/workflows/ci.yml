# Two kinds of run, from one codebase that is pure Python and standard library only, so
# nothing is built per operating system; CI only checks that the same code runs everywhere.
#
# - Every push and pull request: the quick check, on Windows and Linux with Python 3.12; the
#   TypeScript helper's tests (helpers/typescript) with Node 20 on both; the TypeScript
#   contract tests that run the compiler, with the TypeScript that orchestraty/tests/fixtures/ts
#   pins, on both; the editor extension's tests (editors/vscode) with Node 22 on both, and its
#   .vsix packaged on Linux and kept as a build artifact (nothing is published); and the one
#   distribution, its sdist and wheel built on Linux, with the smoke test of that wheel in a
#   clean virtual environment on Windows and Linux.
# - Weekly, on manual runs and on release tags (v*): the full matrix, which adds Python 3.10
#   and 3.11, and macOS (the smoke test too). Releases themselves are release.yml's.
#
# The quick and full jobs run both suites (the main package and the engine); every job fails
# if the tests leave any file behind. pytest is the only Python dependency.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"          # Mondays, 06:00 UTC: the weekly full run

permissions:
  contents: read

jobs:
  quick:
    name: quick (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    # The two-machine team sync tests and the labelled sample of team notes run many git commands,
    # which take about ten times as long on the Windows runner as on Linux: its main package
    # tests now take over 35 minutes there.
    timeout-minutes: 60
    strategy:
      # Report both platforms, even when one of them fails.
      fail-fast: false
      matrix:
        # Pinned rather than ubuntu-latest, so a runner image change never breaks a push.
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      # Printed so a failure shows which git ran (the fixtures depend on git's behaviour).
      - name: Show the git version
        run: git --version

      # No cache and no bytecode, so the leftover check below finds nothing.
      - name: Run the main package tests
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Run the engine tests
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider

      # The tests must leave nothing in the working copy: no __pycache__, no .pytest_cache,
      # no output files. Runs from the repository root, in bash on every OS.
      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine scripts plugins .claude-plugin)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  node:
    name: node helper (${{ matrix.os }}, Node 20)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: helpers/typescript
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: helpers/typescript/package-lock.json

      # The tests run the real hook script and plant notes with the Python package.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dev dependencies from the lockfile
        run: npm ci

      - name: Build
        run: npx tsc -p tsconfig.json

      - name: Run the tests
        run: node --test dist/test/helper.test.js

      # The build output and node_modules are ignored; nothing else may be left.
      - name: Check that the tests left no files behind
        shell: bash
        working-directory: .
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine; git status --porcelain -- helpers)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  # The VS Code and Cursor extension: its unit tests and the extension against a stand-in for
  # the editor's API, on both systems; the .vsix packaged on Linux and kept for a week. The
  # packaging tool needs Node 22. Python runs the tests' checks against the orchestraty package.
  editor:
    name: editor extension (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the dev dependencies from the lockfile
        run: npm ci

      - name: Build and run the tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: npm test

      - name: Package the .vsix
        if: runner.os == 'Linux'
        run: npx vsce package --no-dependencies --skip-license --out orchestraty.vsix

      - name: Keep the .vsix
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: editors/vscode/orchestraty.vsix
          if-no-files-found: error
          retention-days: 7

      # The build output, the .vsix and node_modules are ignored; nothing else may be left.
      - name: Check that the tests left no files behind
        shell: bash
        working-directory: .
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine; git status --porcelain -- editors)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  # Without the compiler these tests are skipped; here ORCH_TS_REQUIRED makes that an error.
  typescript:
    name: TypeScript contracts (${{ matrix.os }}, Node 20)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestraty/tests/fixtures/ts/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Install the pinned TypeScript from the lockfile
        working-directory: orchestraty/tests/fixtures/ts
        run: npm ci

      - name: Run the TypeScript contract tests
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ORCH_TS_REQUIRED: "1"
        run: python -m pytest tests/test_typescript_compiler.py tests/test_typescript.py tests/test_dts.py tests/test_tsimports.py

      # The compiler npm ci installed is ignored and expected; nothing else may be left.
      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine | grep -vxF '!! orchestraty/tests/fixtures/ts/node_modules/' || true)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  # The one distribution: the sdist and the py3-none-any wheel, built once on Linux, and a check
  # of what they hold. The smoke jobs install this wheel.
  package:
    name: package (sdist and wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the build front end and pytest
        run: python -m pip install "build>=1.2" "pytest>=8,<10"

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check what they hold
        working-directory: orchestraty
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ORCH_PACKAGE_REQUIRED: "1"
        run: ORCH_WHEEL="$(ls ../dist/*.whl)" ORCH_SDIST="$(ls ../dist/*.tar.gz)" python -m pytest tests/test_package.py

      - name: Keep them for the smoke test
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The built wheel in a clean virtual environment (scripts/smoke.py): orch --version, orch
  # init --print, two scripted sessions through the installed hook script reaching a note, and
  # orch doctor. No real agent and no network. macOS joins in the full run.
  smoke:
    name: smoke (${{ matrix.os }}, the built wheel)
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '["windows-latest", "ubuntu-24.04", "macos-latest"]' || '["windows-latest", "ubuntu-24.04"]') }}
    steps:
      - name: Check out the repository (for scripts/smoke.py)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the built files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run the smoke test on the wheel
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/smoke.py dist/*.whl

      # The smoke test works in a temporary folder; dist/ is ignored.
      - name: Check that the smoke test left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine scripts plugins .claude-plugin)"
          if [ -n "$leftovers" ]; then
            echo "The smoke test left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi

  full:
    name: full (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Show the git version
        run: git --version

      - name: Run the main package tests
        working-directory: orchestraty
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Run the engine tests
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider

      - name: Check that the tests left no files behind
        shell: bash
        run: |
          leftovers="$(git status --porcelain --ignored -- orchestraty engine scripts plugins .claude-plugin)"
          if [ -n "$leftovers" ]; then
            echo "The tests left files in the working copy:"
            echo "$leftovers"
            exit 1
          fi
