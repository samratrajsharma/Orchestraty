# Releases, from a tag v<version> (the version orchestraty/orchestraty/__init__.py gives):
#
# 1. build: the sdist and the py3-none-any wheel, once, on Linux, with a check of what they hold
#    and that their version is the tag's;
# 2. smoke: that wheel in a clean virtual environment on Windows, macOS and Linux
#    (scripts/smoke.py: orch --version, orch init --print, two scripted sessions through the
#    installed hook script reaching a note, orch doctor);
# 3. draft-release: the files attached to a draft GitHub release, which stays a draft until
#    someone publishes it by hand.
#
# Publishing to PyPI is the pypi job, and it is off: it runs only when this workflow is started
# by hand (Run workflow, on the tag) with publish-to-pypi ticked, which waits for the legal
# check. It uses trusted publishing (an OpenID Connect token for the "pypi" environment), so
# no secret or token is kept anywhere; the trusted publisher is set up on PyPI first.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-to-pypi:
        description: "Also publish the files to PyPI (only after the legal check, and only on a tag)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build the sdist and the wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the build front end and pytest
        run: python -m pip install "build>=1.2" "pytest>=8,<10"

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check that the version is the tag's
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(basename dist/*.whl | cut -d- -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but the version in orchestraty/orchestraty/__init__.py is $version."
            exit 1
          fi

      - name: Check what they hold
        working-directory: orchestraty
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ORCH_PACKAGE_REQUIRED: "1"
        run: ORCH_WHEEL="$(ls ../dist/*.whl)" ORCH_SDIST="$(ls ../dist/*.tar.gz)" python -m pytest tests/test_package.py

      - name: Keep them for the next jobs
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - name: Check out the repository (for scripts/smoke.py)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the built files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run the smoke test on the wheel
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/smoke.py dist/*.whl

  draft-release:
    name: attach the files to a draft release
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # A draft is seen only by those who can write to the repository; publishing it is done by hand.
      - name: Make the draft release, or update its files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Orchestraty $GITHUB_REF_NAME" \
              --notes "The sdist and the py3-none-any wheel, built from $GITHUB_REF_NAME and smoke-tested on Windows, macOS and Linux. Install the wheel with pipx install or uv tool install."
          fi

  pypi:
    name: publish to PyPI (off until the legal check)
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish-to-pypi && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/orchestraty
    permissions:
      id-token: write
    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
