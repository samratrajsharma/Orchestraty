[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orch-engine"
version = "0.1.0"
description = "Orchestraty's effect engine: ingest a repository, parse it and build the code graph that impact, tracking and checks read from."
readme = "README.md"
requires-python = ">=3.10"
# The core is pure standard library on purpose. Optional extras are imported lazily, so a
# missing extra disables one feature instead of breaking import.
dependencies = []

[project.optional-dependencies]
# Parsing for more languages (Go, Java, Rust, C#, Ruby, PHP, C, C++).
treesitter = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.2"]
# The MCP server (orch_engine.mcp_server), written against the mcp 1.x API.
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["orch_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
