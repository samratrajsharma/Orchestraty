# Orchestraty - local control plane (Phase 1)
# Postgres (state store), Redis (event bus), the orchestrator API, and a
# reference echo agent that proves the end-to-end loop.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestraty
      POSTGRES_PASSWORD: orchestraty
      POSTGRES_DB: orchestraty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    environment:
      ORCH_DATABASE_URL: postgresql+asyncpg://orchestraty:orchestraty@postgres:5432/orchestraty
      ORCH_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  echo-agent:
    build: ./agents/echo_agent
    environment:
      ORCH_API_URL: http://orchestrator:8000
      ORCH_REDIS_URL: redis://redis:6379/0
      AGENT_NAME: echo-agent-1
    depends_on:
      - orchestrator
      - redis

volumes:
  postgres_data:
