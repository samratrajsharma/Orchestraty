# Orchestraty - local control plane + AI operations agents + serving
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestraty
      POSTGRES_PASSWORD: orchestraty
      POSTGRES_DB: orchestraty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mlflow:
    build: ./infra/mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  model-server:
    build: ./model_server
    ports:
      - "8080:8080"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    environment:
      ORCH_DATABASE_URL: postgresql+asyncpg://orchestraty:orchestraty@postgres:5432/orchestraty
      ORCH_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  echo-agent:
    build:
      context: ./agents
      dockerfile: echo_agent/Dockerfile
    environment:
      ORCH_API_URL: http://orchestrator:8000
      ORCH_REDIS_URL: redis://redis:6379/0
      AGENT_NAME: echo-agent-1
    depends_on:
      - orchestrator
      - redis

  mlops-agent:
    build:
      context: ./agents
      dockerfile: mlops_agent/Dockerfile
    environment:
      ORCH_API_URL: http://orchestrator:8000
      ORCH_REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AGENT_NAME: mlops-agent-1
    depends_on:
      - orchestrator
      - redis
      - mlflow

  llmops-agent:
    build:
      context: ./agents
      dockerfile: llmops_agent/Dockerfile
    environment:
      ORCH_API_URL: http://orchestrator:8000
      ORCH_REDIS_URL: redis://redis:6379/0
      AGENT_NAME: llmops-agent-1
      LLM_PROVIDER: mock
      LLM_BUDGET_USD: "5.0"
    depends_on:
      - orchestrator
      - redis

  data-transform-agent:
    build:
      context: ./agents
      dockerfile: data_transform_agent/Dockerfile
    environment:
      ORCH_API_URL: http://orchestrator:8000
      ORCH_REDIS_URL: redis://redis:6379/0
      AGENT_NAME: data-transform-agent-1
    depends_on:
      - orchestrator
      - redis

  infra-agent:
    build:
      context: ./agents
      dockerfile: infra_agent/Dockerfile
    environment:
      ORCH_API_URL: http://orchestrator:8000
      ORCH_REDIS_URL: redis://redis:6379/0
      AGENT_NAME: infra-agent-1
      TF_APPLY: "false"
    depends_on:
      - orchestrator
      - redis

  deploy-agent:
    build:
      context: ./agents
      dockerfile: deploy_agent/Dockerfile
    environment:
      ORCH_API_URL: http://orchestrator:8000
      ORCH_REDIS_URL: redis://redis:6379/0
      MODEL_SERVER_URL: http://model-server:8080
      AGENT_NAME: deploy-agent-1
    depends_on:
      - orchestrator
      - redis
      - model-server

volumes:
  postgres_data:
  mlflow_data:
