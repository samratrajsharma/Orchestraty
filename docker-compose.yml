# Orchestraty — local control plane (Phase 1)
# Brings up Postgres (state store), Redis (event bus), and the orchestrator API.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestraty
      POSTGRES_PASSWORD: orchestraty
      POSTGRES_DB: orchestraty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestraty"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    environment:
      ORCH_DATABASE_URL: postgresql+asyncpg://orchestraty:orchestraty@postgres:5432/orchestraty
      ORCH_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
