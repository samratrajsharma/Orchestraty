[pytest]
# Tests for the main package. Run from this folder: python -m pytest
testpaths = tests
python_files = test_*.py
pythonpath = . ../engine
# No .pytest_cache in the working copy. Set PYTHONDONTWRITEBYTECODE=1 as well to avoid __pycache__.
addopts = -q -ra -p no:cacheprovider
markers =
    heavy: a slow test that runs many git commands; the quick Windows run in CI leaves it to the full run
