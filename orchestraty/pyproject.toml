[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestraty"
version = "0.0.1.dev0"
description = "Keeps parallel coding-agent sessions aware of each other."
readme = "README.md"
requires-python = ">=3.10"
# The core is standard library only, like the engine. The engine (orch-engine, in ../engine)
# is installed alongside it for now; the dependency is declared when the coordinator uses it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
orch = "orchestraty.cli:main"

[tool.setuptools.packages.find]
include = ["orchestraty*"]

# The Claude Code mod is JavaScript that orch init copies out of the package.
[tool.setuptools.package-data]
orchestraty = ["mod/.claude-plugin/plugin.json", "mod/hooks/*.json", "mod/hooks/*.js"]
