<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestraty</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="top">
  <a class="brand" href="#/" aria-label="orchestraty, home">
    <svg class="mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><path class="mark-arms" d="M19 18 L50.2 36 M19 78 L50.2 60"/><circle class="mark-dot" cx="71" cy="48" r="11"/></svg>
    <span class="wordmark">orchestraty</span>
  </a>
  <span class="badge-demo" id="demo-badge" hidden>Demo</span>
  <div class="repo-pick" id="repo-pick"></div>
  <div class="top-fill"></div>
  <button type="button" class="pill" id="pill" aria-expanded="false" aria-controls="pop">
    <span class="pill-dot" aria-hidden="true"></span><span id="pill-text">Reading…</span>
  </button>
  <button type="button" class="search" id="search-btn" aria-keyshortcuts="Control+K">
    <span class="search-label"><span class="ic-slot" data-icon="search"></span><span>Search or run…</span></span>
    <kbd class="kbd" id="search-kbd">Ctrl K</kbd>
  </button>
  <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch theme" title="Switch theme"><span class="ic-slot" data-icon="moon"></span></button>
  <button type="button" class="icon-btn" id="help-btn" aria-label="Help and shortcuts" title="Help and shortcuts (?)" aria-keyshortcuts="?"><span class="ic-slot" data-icon="help"></span></button>
</header>
<div class="frame">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<aside class="tour" id="tour" aria-label="Demo tour" hidden></aside>
<div class="pop" id="pop" role="dialog" aria-label="Status" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<p class="sr-only" id="announce" aria-live="polite"></p>
</body>
</html>
