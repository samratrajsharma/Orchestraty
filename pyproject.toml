# One distribution, orchestraty, for every operating system: the product (orchestraty/orchestraty)
# and the contract engine it imports (engine/orch_engine), each built from where it lives. Both
# are pure Python with no runtime dependencies, so the wheel is py3-none-any.
#
#   python -m build                  the sdist and the wheel, into dist/
#   pip install -e .                 both packages, editable, for development
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestraty"
dynamic = ["version"]
description = "Keeps parallel coding-agent sessions on one repository aware of each other."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.optional-dependencies]
# Parsing for more languages in the engine: Go, Java, Rust, C#, Ruby, PHP, C and C++.
treesitter = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.2"]
dev = ["pytest>=8,<10"]

[project.scripts]
orch = "orchestraty.cli:main"

# The one place the version is kept.
[tool.setuptools.dynamic]
version = { attr = "orchestraty.__version__" }

[tool.setuptools.packages.find]
where = ["orchestraty", "engine"]
include = ["orchestraty", "orchestraty.*", "orch_engine", "orch_engine.*"]
namespaces = false

# orch init copies these out of the package: the Claude Code mod. The hook script is a module
# (orchestraty/capture/hook.py), so it is in the package anyway.
[tool.setuptools.package-data]
orchestraty = ["mod/.claude-plugin/plugin.json", "mod/hooks/*.json", "mod/hooks/*.js"]
